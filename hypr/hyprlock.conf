source=~/.config/hypr/scheme/current.conf

$pic = ~/.config/hypr/hyprlock/pic.png
$cover = ~/.config/hypr/hyprlock/cover.sh
$coverImg = ~/.config/hypr/hyprlock/cover.png
$logo = ~/.config/hypr/hyprlock/distro.png
$music = ~/.config/hypr/hyprlock/music.sh
$progress = ~/.config/hypr/hyprlock/progress.sh
$cava = ~/.config/hypr/hyprlock/cava.sh
$capslock = ~/.config/hypr/hyprlock/capslock.sh

### Background ###
background {
    monitor =
    path = screenshot
    blur_passes = 3
}

### X = 1440 ###
### Y = 2560 ###

### MainBox ###
shape {
    monitor =
    size = 556, 720
    color = rgba($surfacebf)
    rounding = 24
    border_size = 2
    border_color = rgba($primary80)
}

### Left Side ###
# User Image (Square)
image {
    monitor =
    path = $pic
    size = 200
    rounding = 24
    border_size = 2
    border_color = rgba($primary40)
    position = 292, 0
    halign = left
}
# Cover (Square)
image {
    monitor =
    path = $coverImg
    size = 200
    rounding = 24
    border_size = 2
    border_color = rgba($primary40)
    position = 526, 0
    halign = left
    reload_time = 2
    reload_cmd = $cover
}

### User Info ###
# Hallo
label {
    monitor =
    text = Hallo,
    color = rgb($onSurface)
    font_size = 16
    font_family = Rubik Italic
    position = 1034, -386
    halign = left
    valign = top
    zindex = 2
}
# Name (User Desc)
label {
    monitor =
    text = $DESC
    color = rgb($primary)
    font_size = 26
    font_family = Rubik Bold
    position = 1034, -412
    halign = left
    valign = top
    zindex = 2
}
# Hostname
label {
    monitor =
    text = cmd[update:1000] hostname
    color = rgb($onSurface)
    font_size = 10
    font_family = Rubik Italic
    position = 1034, -460
    halign = left
    valign = top
    zindex = 2
}
# Uptime
label {
    monitor =
    text = cmd[update:1000] uptime -p | sed -e 's/up / UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = rgb($onSurface)
    font_size = 12
    font_family = Rubik Italic
    position = 1034, -482
    halign = left
    valign = top
    zindex = 2
}
# Distro Logo (Square)
image {
    monitor =
    path = $logo
    size = 132
    rounding = 16
    border_size = 0
    position = -1042, -374
    halign = right
    valign = top
    zindex = 2
}

### Media Info ###
shape {
    monitor =
    size = 492, 132
    color = rgba($surfaceContainera6)
    border_size = 2
    border_color = rgba($primary40)
    rounding = 16
    position = 0, -516
    valign = top
    zindex = 1
}
# Title
label {
    monitor =
    text = cmd[update:1000] echo "$($music --title)"
    color = rgb($tertiary)
    font_size = 22
    font_family = Rubik Bold
    position = 0, 164
    zindex = 5
}
# Album
label {
    monitor =
    text = cmd[update:1000] echo "$($music --album)"
    color = rgb($onSurface)
    font_size = 12
    font_family = Rubik Italic
    position = 0, 132
    zindex = 5
}
# Artist
label {
    monitor =
    text = cmd[update:1000] echo "$($music --artist)"
    color = rgb($onSurface)
    font_size = 14
    font_family = Rubik Medium
    position = 0, 108
    zindex = 5
}
# Control
shape {
    monitor =
    size = 300, 60
    color = rgba($surfaceContainera6)
    border_size = 2
    border_color = rgba($primary40)
    rounding = 36
    position = 0, 20
    zindex = 4
}
# Like Icon
label {
    monitor =
    text = 
    color = rgb($onSurface)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -106, 21
    zindex = 5
}
# Prev Icon
label {
    monitor =
    text = 
    onclick = playerctl previous
    color = rgb($onSurface)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = -60, 20
    zindex = 5
}
# PlayPause Icon
label {
    monitor =
    text = cmd[update:1000] echo "$($music --status)"
    onclick = playerctl play-pause
    color = rgb($primary)
    font_size = 36
    font_family = JetBrainsMono Nerd Font
    position = -6, 20
    zindex = 5
}
# Next Icon
label {
    monitor =
    text = 
    onclick = playerctl next
    color = rgb($onSurface)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 60, 20
    zindex = 5
}
# DisLike Icon
label {
    monitor =
    text = 
    color = rgb($onSurface)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 106, 21
    zindex = 5
}
# Progress
label {
    monitor =
    text = cmd[update:1000] $progress $primary $onSurface
    color = rgb($onSurface)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -34
    zindex = 3
}
# Visualizer
label {
    monitor =
    text = cmd[update:1000] $cava $tertiary $surfaceContainer
    font_size = 6
    font_family = JetBrainsMono Nerd Font
    position = 0, -92
    zindex = 3
}

### Authentication ###
shape {
    monitor =
    size = 492, 60
    color = rgba($surfaceContainerHighesta6)
    border_size = 2
    border_color = rgba($primary40)
    rounding = 16
    position = 0, 514
    valign = bottom
    zindex = 2
}
# Username
label {
    monitor =
    text = $USER
    color = rgb($onSurface)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 528
    valign = bottom
    zindex = 3
}
# Password
input-field {
    monitor =
    size = 492, 60
    check_color = rgb($tertiary)
    check_text = Authenticating...
    fail_color = rgb($error)
    fail_text = Try Again!
    outer_color = rgb($primary)
    inner_color = rgb($primary)
    outline_thickness = 2
    font_color = rgb($onPrimary)
    font_family = Rubik
    fade_on_empty = false
    placeholder_text = Password
    rounding = 16
    position = 0, 438
    valign = bottom
    zindex = 2
}
# CapsLock Status
label {
    monitor =
    text = cmd[update:250] $capslock
    color = rgb($onSurface)
    font_size = 10
    font_family = Rubik Italic
    position = 0, 392
    valign = bottom
    zindex = 2
}

### Right Side ###
shape {
    monitor =
    size = 500, 200
    color = rgba($surface80)
    rounding = 24
    border_size = 2
    border_color = rgba($primary40)
    position = -258, 0
    halign = right
}
# Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%I")<span foreground='##$onSurface'>:</span><span foreground='##$tertiary'>$(date +"%M")</span>"
    text_align = left
    color = rgb($primary)
    font_size = 100
    font_family = Rubik Heavy
    position = 1814, 24
    halign = left
    zindex = 1
}
# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "<span foreground='##$tertiary'>$(date +"%A, ")</span>$(date +"%B %d %Y")"
    text_align = left
    color = rgb($onSurface)
    font_size = 24
    font_family = Rubik
    position = 1822, -54
    halign = left
    zindex = 1
}

### Other ###
shape {
    monitor =
    size = 162, 43
    color = rgba($surface80)
    border_size = 2
    border_color = rgba($primary40)
    rounding = 50
    position = 0, -28
    valign = top
}
# Media Source
label {
    monitor =
    text = cmd[update:1000] echo "$($music --source)"
    color = rgb($onSurface)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -38
    valign = top
    zindex = 1
}
shape {
    monitor =
    size = 210, 43
    color = rgba($surface80)
    border_size = 2
    border_color = rgba($primary40)
    rounding = 50
    position = 0, 28
    valign = bottom
}
# Keyboard Layout
label {
    monitor =
    text =  $LAYOUT
    color = rgb($onSurface)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    valign = bottom
    zindex = 1
}


