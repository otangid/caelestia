source=~/.config/hypr/scheme/current.conf

$wall = ~/.hyprlock-wall
$pic = ~/.face
$logo = ~/.config/hypr/hyprlock/distro.png

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 3
}

# X = 1440
# Y = 2560

# MainBox
shape {
    monitor =
    size = 640, 720
    color = rgba($surfacebf)
    rounding = 24
    border_size = 2
    border_color = rgba($primary80)
}

# LeftTop
shape {
    monitor =
    size = 100, 100
    color = rgba($surfaceContainera6)
    rounding = 16
    position = 976, -376
    halign = left
    valign = top
    zindex = 1
}
image {
    monitor =
    path = $logo
    size = 76
    border_size = 0
    position = 989, -389
    halign = left
    valign = top
    zindex = 2
}

# LeftBottom
shape {
    monitor =
    size = 100, 300
    color = rgb($tertiary)
    rounding = 16
    position = 976, 376
    halign = left
    valign = bottom
    zindex = 1
}
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgb($onTertiary)
    font_size = 36
    font_family = Rubik Heavy
    rotate = 90
    position = 982, 392
    halign = left
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgb($onTertiary)
    font_size = 18
    font_family = Rubik
    rotate = 90
    position = 1036, 392
    halign = left
    valign = bottom
    zindex = 2
}

# RightTop
shape {
    monitor =
    size = 492, 140
    color = rgba($surfaceContainera6)
    rounding = 16
    position = -976, -376
    halign = right
    valign = top
    zindex = 1
}
image {
    monitor =
    path = $pic
    size = 108
    rounding = -1
    border_size = 2
    border_color = rgb($tertiary)
    position = -992, -390
    halign = right
    valign = top
    zindex = 2
}
label {
    monitor =
    text = Hallo,
    color = rgb($onSurface)
    font_size = 16
    font_family = Rubik Italic
    position = 1108, -386
    halign = left
    valign = top
    zindex = 2
}
label {
    monitor =
    text = $DESC
    color = rgb($primary)
    font_size = 26
    font_family = Rubik Bold
    position = 1108, -412
    halign = left
    valign = top
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] hostname
    color = rgb($onSurface)
    font_size = 10
    font_family = Rubik Italic
    position = 1108, -460
    halign = left
    valign = top
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] uptime -p | sed -e 's/up /   UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = rgb($onSurface)
    font_size = 12
    font_family = Rubik Italic
    position = 1108, -482
    halign = left
    valign = top
    zindex = 2
}

# RightCenter
shape {
    monitor =
    size = 492, 316
    color = rgba($surfaceContainera6)
    rounding = 16
    position = -976, -531
    halign = right
    valign = top
    zindex = 1
}

# RightBottom
shape {
    monitor =
    size = 492, 200
    color = rgba($surfaceContainera6)
    rounding = 16
    position = -976, 376
    halign = right
    valign = bottom
    zindex = 1
}
shape {
    monitor =
    size = 460, 60
    color = rgb($primaryContainer)
    rounding = 8
    position = -992, 498
    halign = right
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = $USER
    color = rgb($onPrimaryContainer)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Mono
    position = 54, 512
    valign = bottom
    zindex = 3
}
input-field {
    monitor =
    size = 460, 60
    check_color = rgb($tertiary)
    check_text = Authenticating...
    fail_color = rgb($error)
    fail_text = Try Again!
    outer_color = rgb($primary)
    inner_color = rgba($surfaceContainera6)
    outline_thickness = 2
    font_color = rgb($onSurface)
    font_family = Rubik
    fade_on_empty = false
    placeholder_text = Password
    rounding = 36
    position = -992, 422
    halign = right
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/capslock.sh
    color = rgb($onSurface)
    font_size = 10
    font_family = Rubik Italic
    position = 54, 392
    valign = bottom
    zindex = 2
}

# Other
label {
    monitor =
    text = $LAYOUT
    color = rgb($onSurface)
    font_size = 14
    font_family = Rubik
    position = 0, 32
    valign = bottom
    zindex = 1
}


